<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="./assets/styles/style.css">
</head>
<body>
    <div class="wrapper">
        <div class="datepicker" data-component="datepicker">
            <div class="datepicker__form">
                <input class="datepicker__input" type="text" placeholder="dd/mm/yyyy" readonly>
                <button class="datepicker__toggle" data-datepicker="toggle">
                    <img src="./assets/img/icons/calendar.svg" alt="Toggle Calendar">
                </button>
            </div>
            <div class="datepicker__calendar" data-datepicker="calendar">
                <div class="datepicker__nav">
                    <div class="datepicker__month">February</div>
                    <div class="datepicker__buttons">
                        <button class="datepicker__button datepicker__button--prev">
                            <img src="./assets/img/icons/arrow.svg" class="responsive-image" alt="Previous month">
                        </button>
                        <button class="datepicker__button datepicker__button--next">
                            <img src="./assets/img/icons/arrow.svg" class="responsive-image"" alt="Next month">
                        </button>
                    </div>
                </div>
                <div class="datepicker__dates">
                    <div class="datepicker__week">
                        <span class="datepicker__week-symbol">M</span>
                        <span class="datepicker__week-symbol">T</span>
                        <span class="datepicker__week-symbol">W</span>
                        <span class="datepicker__week-symbol">T</span>
                        <span class="datepicker__week-symbol">F</span>
                        <span class="datepicker__week-symbol">S</span>
                        <span class="datepicker__week-symbol">S</span>
                    </div>
                    <div class="datepicker__days">
                        <span class="datepicker__days-symbol">1</span>
                        <span class="datepicker__days-symbol">2</span>
                        <span class="datepicker__days-symbol">3</span>
                        <span class="datepicker__days-symbol">4</span>
                        <span class="datepicker__days-symbol">5</span>
                        <span class="datepicker__days-symbol">6</span>
                        <span class="datepicker__days-symbol">7</span>
                        <span class="datepicker__days-symbol">8</span>
                        <span class="datepicker__days-symbol">9</span>
                        <span class="datepicker__days-symbol">10</span>
                        <span class="datepicker__days-symbol">11</span>
                        <span class="datepicker__days-symbol">12</span>
                        <span class="datepicker__days-symbol">13</span>
                        <span class="datepicker__days-symbol">14</span>
                        <span class="datepicker__days-symbol">15</span>
                        <span class="datepicker__days-symbol">16</span>
                        <span class="datepicker__days-symbol">17</span>
                        <span class="datepicker__days-symbol">18</span>
                        <span class="datepicker__days-symbol">19</span>
                        <span class="datepicker__days-symbol">20</span>
                        <span class="datepicker__days-symbol">21</span>
                        <span class="datepicker__days-symbol">22</span>
                        <span class="datepicker__days-symbol">23</span>
                        <span class="datepicker__days-symbol">24</span>
                        <span class="datepicker__days-symbol">25</span>
                        <span class="datepicker__days-symbol">26</span>
                        <span class="datepicker__days-symbol">27</span>
                        <span class="datepicker__days-symbol">28</span>
                        <span class="datepicker__days-symbol">29</span>
                        <span class="datepicker__days-symbol">30</span>
                        <span class="datepicker__days-symbol">31</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./assets/scripts/index.js"></script>
</body>
</html>
